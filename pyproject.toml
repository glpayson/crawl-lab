[project]
name = "crawl-lab"
version = "0.1.0"
description = "A lab for experimenting with AI decision backends that play Dungeon Crawl Stone Soup"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "websockets==16.0",
]

[project.scripts]
crawl-lab = "crawl_lab.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: opt-in checks against the local DCSS server"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
